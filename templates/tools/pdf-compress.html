<div id="drop" class="tk-drop">🗜️ Klik atau seret satu file PDF ke sini</div>
<ul id="filelist" class="tk-filelist"></ul>
<div id="opts" class="d-none mt-3">
  <p class="small text-secondary">Perkecil ukuran PDF dengan mengatur resolusi (DPI) & kualitas gambar — hasilnya tidak pernah lebih besar dari aslinya.</p>
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label small">Resolusi <span class="text-muted">(DPI)</span></label>
      <select id="dpi" class="form-select">
        <option value="72">72 (screen)</option>
        <option value="100">100</option>
        <option value="150" selected>150 (cetak)</option>
        <option value="200">200</option>
        <option value="300">300 (photo)</option>
        <option value="600">600 (professional)</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label small">Kualitas JPEG</label>
      <input id="quality" type="range" class="form-range" min="10" max="100" value="80">
      <div class="small text-secondary"><span id="qlabel">80</span>%</div>
    </div>
    <div class="col-md-4 d-flex align-items-end">
      <button id="run" class="btn btn-tk w-100">🗜️ Kompres & Unduh</button>
      <div id="prog" class="small text-secondary mt-2"></div>
    </div>
  </div>
</div>
<div id="result" class="mt-3"></div>
