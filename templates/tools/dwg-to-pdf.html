
<div id="drop" class="tk-drop">📐 Klik atau seret gambar AutoCAD (.dwg/.dxf) ke sini</div>
<ul id="filelist" class="tk-filelist"></ul>
<div id="opts" class="d-none mt-3">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label small">Ukuran kertas</label>
      <select id="paper" class="form-select"><option value="a4" selected>A4</option><option value="a3">A3</option><option value="a2">A2</option><option value="letter">Letter</option></select></div>
    <div class="col-md-4"><label class="form-label small">Orientasi</label>
      <select id="orient" class="form-select"><option value="landscape" selected>Landscape</option><option value="portrait">Portrait</option></select></div>
    <div class="col-md-4"><label class="form-label small">Skala (%)</label>
      <input id="scale" type="number" class="form-control" value="100" min="10" max="400"></div>
  </div>
  <p class="small text-secondary mt-2">DWG dikonversi lewat server (libredwg → DXF → PDF). File dihapus otomatis setelah diproses.</p>
  <button id="run" class="btn btn-tk mt-2">🔄 DWG ke PDF</button>
  <div id="prog" class="small text-secondary mt-2"></div>
</div>
<div id="result" class="mt-3"></div>
