
<label class="form-label small">Input</label>
<textarea id="input" class="form-control tk-code" rows="5" placeholder="Teks yang mau diubah…"></textarea>
<div class="d-flex flex-wrap gap-2 mt-2" id="btns">
  <button data-case="upper" class="btn btn-outline-info btn-sm">UPPERCASE</button>
  <button data-case="lower" class="btn btn-outline-info btn-sm">lowercase</button>
  <button data-case="title" class="btn btn-outline-info btn-sm">Title Case</button>
  <button data-case="sentence" class="btn btn-outline-info btn-sm">Sentence case</button>
  <button data-case="camel" class="btn btn-outline-info btn-sm">camelCase</button>
  <button data-case="pascal" class="btn btn-outline-info btn-sm">PascalCase</button>
  <button data-case="snake" class="btn btn-outline-info btn-sm">snake_case</button>
  <button data-case="kebab" class="btn btn-outline-info btn-sm">kebab-case</button>
  <button data-case="constant" class="btn btn-outline-info btn-sm">CONSTANT_CASE</button>
  <button data-case="alternating" class="btn btn-outline-info btn-sm">aLtErNaTiNg</button>
  <button data-case="inverse" class="btn btn-outline-info btn-sm">iNVERSE</button>
</div>
<label class="form-label small mt-3">Hasil</label>
<textarea id="output" class="form-control tk-code" rows="5" readonly></textarea>
<button id="copy" class="btn btn-outline-info btn-sm mt-2">📋 Salin</button>
