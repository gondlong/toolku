
<ul class="nav nav-tabs mb-3" role="tablist">
  <li class="nav-item"><button id="tab-files" class="nav-link active" data-mode="files">📁 Dari File</button></li>
  <li class="nav-item"><button id="tab-url" class="nav-link" data-mode="urls">🔗 Dari URL</button></li>
</ul>
<div id="file-mode">
  <div id="drop" class="tk-drop">🖼️ Klik atau seret gambar ke sini (bisa banyak sekaligus)</div>
  <ul id="filelist" class="tk-filelist"></ul>
  <div class="row g-3 mt-1">
    <div class="col-md-4"><label class="form-label small">Format tujuan</label>
      <select id="fmt" class="form-select"><option value="png">PNG</option><option value="jpeg" selected>JPG</option><option value="webp">WebP</option></select></div>
    <div class="col-md-4"><label class="form-label small">Kualitas (JPG/WebP): <span id="qlabel">92</span>%</label><input id="quality" type="range" class="form-range" min="10" max="100" value="92"></div>
  </div>
</div>
<div id="url-mode" class="d-none">
  <label class="form-label small">Satu URL per baris (bisa banyak)</label>
  <textarea id="url-input" class="form-control tk-code" rows="6" placeholder="https://cdn.example.com/foto1.jpg&#10;https://gambar.webp"></textarea>
  <div class="form-check mt-2 small">
    <input id="url-ext" type="checkbox" class="form-check-input me-1">
    <label class="form-check-label small">Nama file dari URL (mis. foto.webp → foto.jpg)</label>
  </div>
  <div id="url-errors" class="d-none small text-danger mt-2"></div>
</div>
<button id="run" class="btn btn-tk mt-3" disabled>🔄 Konversi</button>
<div id="prog" class="small text-secondary mt-2"></div>
<div id="result" class="mt-3"></div>
