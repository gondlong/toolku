
<div class="d-flex gap-2 mb-2">
  <button id="mode-enc" class="btn btn-tk btn-sm">Encode</button>
  <button id="mode-dec" class="btn btn-outline-info btn-sm">Decode</button>
  <button id="swap" class="btn btn-outline-secondary btn-sm ms-auto">⇅ Tukar input/hasil</button>
</div>
<label class="form-label small">Input</label>
<textarea id="input" class="form-control tk-code" rows="6" placeholder="Teks biasa…"></textarea>
<button id="run" class="btn btn-tk mt-2">🔐 Encode Base64</button>
<label class="form-label small mt-3">Hasil</label>
<textarea id="output" class="form-control tk-code" rows="6" readonly></textarea>
<div class="d-flex gap-2 mt-2">
  <button id="copy" class="btn btn-outline-info btn-sm">📋 Salin</button>
  <button id="dl" class="btn btn-outline-info btn-sm">⬇️ Unduh .txt</button>
</div>
