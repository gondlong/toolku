
<div class="row g-3">
  <div class="col-md-6">
    <label class="form-label small">Panjang: <span id="lenlabel">16</span> karakter</label>
    <input id="len" type="range" class="form-range" min="4" max="128" value="16">
  </div>
  <div class="col-md-6 d-flex flex-wrap gap-3 align-items-center">
    <label class="form-check-label small"><input id="lower" type="checkbox" class="form-check-input me-1" checked>a-z</label>
    <label class="form-check-label small"><input id="upper" type="checkbox" class="form-check-input me-1" checked>A-Z</label>
    <label class="form-check-label small"><input id="digits" type="checkbox" class="form-check-input me-1" checked>0-9</label>
    <label class="form-check-label small"><input id="symbols" type="checkbox" class="form-check-input me-1" checked>!@#$</label>
    <label class="form-check-label small"><input id="noambig" type="checkbox" class="form-check-input me-1">Hindari karakter mirip (0O1lI)</label>
  </div>
</div>
<button id="run" class="btn btn-tk mt-3">🗝️ Generate Password</button>
<div class="input-group mt-3">
  <input id="output" class="form-control tk-code" readonly style="font-size:1.05rem">
  <button id="copy" class="btn btn-outline-info">📋 Salin</button>
</div>
<div class="mt-3">
  <div class="progress" style="height:8px"><div id="meter" class="progress-bar" style="width:0%"></div></div>
  <div id="strength" class="small text-secondary mt-1"></div>
</div>
