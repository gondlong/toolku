
<div id="drop" class="tk-drop">✍️ Klik atau seret satu file PDF ke sini</div>
<ul id="filelist" class="tk-filelist"></ul>
<div id="opts" class="d-none mt-3">
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-draw">✏️ Gambar</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-upload">📎 Unggah</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-draw">
      <div class="row g-3">
        <div class="col-md-8">
          <canvas id="sig-pad" width="600" height="180" style="width:100%;height:180px;background:#fff;border-radius:.5rem;touch-action:none;cursor:crosshair"></canvas>
          <p class="small text-secondary mt-1">Tarik untuk menandatangani (dukung tekanan pena/stylus). Tekan ✕ untuk mengosongkan.</p>
        </div>
        <div class="col-md-4">
          <label class="form-label small">Warna pena</label><input id="sig-color" type="color" class="form-control form-control-color" value="#111827">
          <label class="form-label small mt-2">Ketebalan</label><input id="sig-width" type="range" class="form-range" min="1" max="12" value="3">
          <button id="sig-clear" class="btn btn-outline-secondary btn-sm mt-2">✕ Kosongkan</button>
        </div>
      </div>
    </div>
    <div class="tab-pane fade" id="tab-upload">
      <div id="sig-drop" class="tk-drop">📎 Klik atau seret gambar tanda tangan (PNG dengan background transparan)</div>
      <div id="sig-fileinfo" class="small text-secondary mt-2"></div>
    </div>
  </div>
  <div class="row g-3 mt-2">
    <div class="col-md-3"><label class="form-label small">Halaman</label><input id="sig-page" type="number" class="form-control" value="1" min="1"></div>
    <div class="col-md-3"><label class="form-label small">Posisi X (mm dari kiri)</label><input id="sig-x" type="number" class="form-control" value="30"></div>
    <div class="col-md-3"><label class="form-label small">Posisi Y (mm dari bawah)</label><input id="sig-y" type="number" class="form-control" value="20"></div>
    <div class="col-md-3"><label class="form-label small">Lebar (mm)</label><input id="sig-w" type="number" class="form-control" value="50"></div>
  </div>
  <button id="run" class="btn btn-tk mt-3">✍️ Tanda tangan PDF</button>
  <div id="prog" class="small text-secondary mt-2"></div>
</div>
<div id="result" class="mt-3"></div>
