
<label class="form-label small">Teks / URL</label>
<textarea id="text" class="form-control tk-code" rows="3" placeholder="https://www.ndlong.my.id"></textarea>
<div class="row g-3 mt-1">
  <div class="col-md-3"><label class="form-label small">Ukuran PNG</label>
    <select id="size" class="form-select"><option>256</option><option selected>512</option><option>1024</option></select></div>
  <div class="col-md-3"><label class="form-label small">Koreksi error</label>
    <select id="ecc" class="form-select"><option value="L">L (7%)</option><option value="M" selected>M (15%)</option><option value="Q">Q (25%)</option><option value="H">H (30%)</option></select></div>
  <div class="col-md-3"><label class="form-label small">Warna modul</label><input id="fg" type="color" class="form-control form-control-color" value="#000000"></div>
  <div class="col-md-3"><label class="form-label small">Warna latar</label><input id="bg" type="color" class="form-control form-control-color" value="#ffffff"></div>
</div>
<button id="run" class="btn btn-tk mt-3">📱 Buat QR Code</button>
<div id="result" class="mt-3"></div>
