
<div id="drop" class="tk-drop">✂️ Klik atau seret satu file PDF ke sini</div>
<ul id="filelist" class="tk-filelist"></ul>
<div id="opts" class="d-none mt-3">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label small">Mode</label>
      <select id="mode" class="form-select">
        <option value="range">Ambil halaman tertentu (satu PDF)</option>
        <option value="every">Pecah tiap N halaman (ZIP)</option>
        <option value="each">Satu PDF per halaman (ZIP)</option>
      </select>
    </div>
    <div class="col-md-4" id="range-wrap">
      <label class="form-label small">Rentang halaman (mis. 1-3,5,8-10)</label>
      <input id="range" class="form-control" placeholder="1-3,5">
    </div>
    <div class="col-md-4 d-none" id="every-wrap">
      <label class="form-label small">Jumlah halaman per file (N)</label>
      <input id="everyn" type="number" class="form-control" value="1" min="1">
    </div>
  </div>
  <div id="info" class="small text-secondary mt-2"></div>
  <button id="run" class="btn btn-tk mt-3">✂️ Pisahkan</button>
</div>
<div id="prog" class="small text-secondary mt-2"></div>
<div id="result" class="mt-3"></div>
