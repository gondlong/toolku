
<div id="drop" class="tk-drop">🔓 Klik atau seret satu file PDF terproteksi ke sini</div>
<ul id="filelist" class="tk-filelist"></ul>
<div id="opts" class="d-none mt-3">
  <label class="form-label small">Password (kosongkan jika PDF tanpa password)</label>
  <input id="u-pass" type="password" class="form-control">
  <p class="small text-secondary mt-2">Diolah di server, file dihapus otomatis setelah diproses.</p>
  <button id="run" class="btn btn-tk mt-2">🔓 Buka Proteksi</button>
  <div id="prog" class="small text-secondary mt-2"></div>
</div>
<div id="result" class="mt-3"></div>
