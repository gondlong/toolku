
<ul class="nav nav-tabs mb-3">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-text">Dari Teks</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-file">Dari File</button></li>
</ul>
<div class="tab-content">

    <textarea id="text" class="form-control tk-code" rows="5" placeholder="Teks yang mau di-hash…"></textarea>
  </div>
  <div class="tab-pane fade" id="tab-file">
    <div id="drop" class="tk-drop">#️⃣ Klik atau seret file apa pun ke sini</div>
    <div id="fileinfo" class="small text-secondary mt-2"></div>
  </div>

  <label class="form-check-label small"><input type="checkbox" class="form-check-input me-1" value="SHA-1" checked>SHA-1</label>
  <label class="form-check-label small"><input type="checkbox" class="form-check-input me-1" value="SHA-256" checked>SHA-256</label>
  <label class="form-check-label small"><input type="checkbox" class="form-check-input me-1" value="SHA-384">SHA-384</label>
  <label class="form-check-label small"><input type="checkbox" class="form-check-input me-1" value="SHA-512">SHA-512</label>
