
<div class="row g-2">
  <div class="col-md-8"><label class="form-label small">Pola regex (tanpa /…/)</label><input id="pattern" class="form-control tk-code" placeholder="\b\w+@\w+\.\w+\b"></div>
  <div class="col-md-4"><label class="form-label small">Flags</label>
    <div class="d-flex gap-3 pt-1">
      <label class="small"><input type="checkbox" class="form-check-input me-1 fl" value="g" checked>g</label>
      <label class="small"><input type="checkbox" class="form-check-input me-1 fl" value="i">i</label>
      <label class="small"><input type="checkbox" class="form-check-input me-1 fl" value="m">m</label>
      <label class="small"><input type="checkbox" class="form-check-input me-1 fl" value="s">s</label>
      <label class="small"><input type="checkbox" class="form-check-input me-1 fl" value="u">u</label>
    </div>
  </div>
</div>
<label class="form-label small mt-3">Teks uji</label>
<textarea id="text" class="form-control tk-code" rows="6">Hubungi heru.pranyoto@ndlong.my.id atau admin@contoh.id untuk info.</textarea>
<div id="error" class="small text-danger mt-2"></div>
<label class="form-label small mt-2">Teks dengan match disorot</label>
<div id="highlight" class="tk-result-card small" style="white-space:pre-wrap;word-break:break-word"></div>
<div id="matches" class="mt-3"></div>
