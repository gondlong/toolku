
<div id="drop" class="tk-drop">🔴 Klik atau seret satu file PDF ke sini</div>
<ul id="filelist" class="tk-filelist"></ul>
<div id="editor" class="d-none mt-3">
  <div class="row g-2 align-items-center mb-2">
    <div class="col-auto"><label class="form-label small mb-0 me-1">Halaman</label></div>
    <div class="col-auto"><input id="pg-num" type="number" class="form-control form-control-sm" style="width:70px" value="1" min="1"></div>
    <div class="col-auto"><span id="pg-total" class="small text-secondary"></span></div>
    <div class="col-auto ms-auto"><button id="pg-prev" class="btn btn-sm btn-outline-secondary">‹</button><button id="pg-next" class="btn btn-sm btn-outline-secondary">›</button></div>
  </div>
  <div id="canvas-wrap" style="position:relative;overflow:auto;background:#0d1425;border:1px solid #24304a;border-radius:.5rem;padding:.5rem">
    <canvas id="pdf-canvas" style="display:block;max-width:100%"></canvas>
    <canvas id="overlay" style="position:absolute;left:.5rem;top:.5rem"></canvas>
  </div>
  <p class="small text-secondary mt-1">Drag di halaman untuk menandai area yang harus dihitamkan. Area yang ditandai akan dihitamkan permanen di PDF baru (teks asli benar-benar hilang, bukan cuma ditutup).</p>
  <div class="d-flex gap-2 mt-2">
    <button id="undo" class="btn btn-outline-secondary btn-sm">↶ Undo</button>
    <button id="clear-all" class="btn btn-outline-secondary btn-sm">🗑 Hapus semua</button>
    <button id="run" class="btn btn-tk ms-auto">🔴 Terapkan Redaksi</button>
  </div>
  <div id="prog" class="small text-secondary mt-2"></div>
</div>
<div id="result" class="mt-3"></div>
