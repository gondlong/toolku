
<div id="drop" class="tk-drop">🌐 Klik atau seret satu file PDF ke sini</div>
<ul id="filelist" class="tk-filelist"></ul>
<div id="opts" class="d-none mt-3">
  <div class="row g-3">
    <div class="col-md-4">
      <label for="source-lang" class="form-label small">Bahasa sumber</label>
      <select id="source-lang" class="form-select form-select-sm">
        <option value="auto">Deteksi otomatis (auto)</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="target-lang" class="form-label small">Terjemahkan ke</label>
      <select id="target-lang" class="form-select form-select-sm">
        <option value="id">Bahasa Indonesia (id)</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="out-format" class="form-label small">Format hasil</label>
      <select id="out-format" class="form-select form-select-sm">
        <option value="pdf" selected>PDF — layout asli dipertahankan</option>
        <option value="docx">DOCX — dokumen Word</option>
        <option value="txt">TXT — teks murni</option>
      </select>
    </div>
  </div>
  <p id="fmt-hint" class="small text-secondary mt-2 mb-0"></p>
  <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
    <button id="run" class="btn btn-tk">🌐 Terjemahkan PDF</button>
    <div id="prog" class="small text-secondary"></div>
  </div>
  <div id="spin" class="mt-3 d-none">
    <div class="progress" role="status" aria-live="polite">
      <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div>
    </div>
    <p class="small text-secondary mt-2 mb-0">
      Menerjemahkan blok teks… proses ini bisa memakan waktu beberapa menit untuk PDF panjang.
    </p>
  </div>
</div>
<div id="result" class="mt-3"></div>
